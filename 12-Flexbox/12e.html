<!DOCTYPE html>
<html>
    <head>
        <title>12e</title>
    </head>
    <style>
        .container{
            border-width: 1px;
            border-style: solid;
            border-color: rgb(200, 200, 200);
            width: 300px;
            border-radius: 6px;
            
        }
        .flex{
            display:flex;
            flex-direction:row;
            justify-content:space-between;
            align-items:center;
            padding:6px 12px 6px 12px;
            
        }
        .notification{
            background-color: rgb(49, 109, 245);
            color:white;
            border-radius:20px;
            text-align:center;
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 20px;
            font-size:14px;
            font-weight:bold;
        }
    </style>
    <body>
        <div class="container">
            <div class="flex">
                <div>Home</div>
                <div class="notification">14</div>
            </div>
            <div class="flex">
                <div>notification</div>
                <div class="notification">3</div>
            </div>
            <div class="flex">
                <div>Messages</div>
                <div class="notification">5</div>
            </div>
        </div> 
    </body>
</html>
