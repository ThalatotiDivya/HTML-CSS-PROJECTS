<!DOCTYPE html>
<html>
    <head>
        <title>15d</title>
    </head>
    <style>
        .position{
            background-color:rgb(116, 112, 112);
            width:320px;
            height:180px;
            position:fixed;
            right:10px;
            bottom:20px;
            font-family: Arial;
            font-size: 20px;
            
        }
        .close-button{
            background-color:black;
            color:white;
            position:absolute;
            top:-20px;
            left:-15px;
            font-family: Arial;
            font-size: 20px;
            width:45px;
            height:45px;
            border-radius:25px;
            display:flex;
            justify-content: center;
            align-items:center; 
        }
        .time{
            background-color:black;
            color:white;
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial;
            font-size: 18px;
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 10px;
            padding-right: 10px;
            
        }
    </style>
    <body style="height:3000px">
        <div class="position">
            <div class="close-button">X</div>
            <div class="time">0:29</div>
        </div>
    </body>
</html>s
