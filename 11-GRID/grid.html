<!DOCTYPE html>
<html>
    <head>
        <title>Grid practice</title>
    </head>
    <body>
        <div style="
                display:grid;
                grid-template-columns:100px 100px;
                margin-bottom:30px;
            ">
            <div style="background-color:
            pink;">100px</div>
            <div style="background-color:
            lightblue;">100px<p>text</p></div>
        </div>



         <div style="
                display:grid;
                grid-template-columns:100px 100px 200px;
                margin-bottom:30px;
            ">
            <div style="background-color:
            pink;">100px</div>
            <div style="background-color:
            lightblue;">100px<p>text</p></div>
            <div style="background-color:
            pink;">200px</div>
        </div>



        <div style="
                display:grid;
                grid-template-columns:100px 1fr;
                margin-bottom:30px;
            ">
            <div style="background-color:
            pink;">100px</div>
            <div style="background-color:
            lightblue;">100px</div> 
        </div>

        <div style="
                display:grid;
                grid-template-columns:100px 1fr 1fr;
                margin-bottom:30px;
            ">
            <div style="background-color:
            pink;">100px</div>
            <div style="background-color:
            lightblue;">1fr</div> 
            <div style="background-color:
            pink;">1fr</div>
        </div>


        <div style="
                display:grid;
                grid-template-columns:100px 1fr 2fr;
                margin-bottom:30px;
            ">
            <div style="background-color:
            pink;">100px</div>
            <div style="background-color:
            lightblue;">1fr</div> 
            <div style="background-color:
            pink;">2fr</div>
        </div>
    </body>
</html>
